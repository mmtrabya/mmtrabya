name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: mmtrabya
          svg_out_path: dist/github-contribution-grid-snake.svg

      - name: Push to GitHub
        uses: JamesIves/github-pages-deploy-action@v4.3.3
        with:
          branch: output
          folder: dist
