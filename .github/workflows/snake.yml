name: Full History Snake

on:
  workflow_dispatch:  # Manual trigger for testing
  schedule:
    - cron: "0 0 * * *"  # Daily update

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Full History Snake
        uses: Platane/snk@v3
        with:
          github_user_name: mmtrabya
          year: all  # Force all years
          size: 3000  # Width to accommodate all days
          outputs: |
            dist/full-history-snake.svg
            dist/full-history-snake-dark.svg?palette=github-dark

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          clean: true
